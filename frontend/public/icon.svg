<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>NGA Wallpapers</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="68%">
      <stop offset="0" stop-color="#15151c"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e3a2"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8a6d1f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a30"/>
      <stop offset="1" stop-color="#20406e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8eef7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8eef7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="painting"><rect x="176" y="176" width="672" height="672" rx="90"/></clipPath>
    <clipPath id="card"><rect x="0" y="0" width="1024" height="1024" rx="225"/></clipPath>
    <mask id="moonCut" maskUnits="userSpaceOnUse" x="540" y="150" width="320" height="320">
      <circle cx="690" cy="300" r="74" fill="white"/>
      <circle cx="728" cy="282" r="62" fill="black"/>
    </mask>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

    <!-- gilded frame -->
    <rect x="96" y="96" width="832" height="832" rx="150" fill="url(#gold)"/>
    <!-- dark bevel between frame and painting -->
    <rect x="166" y="166" width="692" height="692" rx="98" fill="#5c4a18"/>

    <!-- the painting (the image glyph, oil-painted) -->
    <g clip-path="url(#painting)">
      <rect x="176" y="176" width="672" height="672" fill="url(#sky)"/>
      <!-- stars -->
      <circle cx="282" cy="276" r="5" fill="#cdd7ea" opacity="0.9"/>
      <circle cx="372" cy="372" r="4" fill="#cdd7ea" opacity="0.7"/>
      <circle cx="300" cy="470" r="3" fill="#cdd7ea" opacity="0.55"/>
      <!-- crescent moon (the glyph's circle, carved to a crescent) -->
      <circle cx="690" cy="300" r="132" fill="url(#moonGlow)"/>
      <circle cx="690" cy="300" r="70" fill="#e8eef7" mask="url(#moonCut)"/>
      <!-- mountains (the glyph's two peaks) -->
      <polygon points="200,848 460,470 720,848" fill="#18314f"/>
      <polygon points="540,848 700,582 848,848" fill="#1f3b60"/>
      <!-- moonlit ridge highlights -->
      <polyline points="460,470 720,848" fill="none" stroke="#34598c" stroke-width="6" opacity="0.5"/>
      <polyline points="700,582 848,848" fill="none" stroke="#34598c" stroke-width="6" opacity="0.45"/>
      <!-- snow caps -->
      <polygon points="418,524 460,470 502,524" fill="#eef3fb"/>
      <polygon points="669,630 700,582 731,630" fill="#eef3fb"/>
      <!-- varnish sheen -->
      <rect x="176" y="176" width="672" height="672" fill="url(#sheen)"/>
    </g>

    <!-- frame highlight edge -->
    <rect x="97.5" y="97.5" width="829" height="829" rx="149" fill="none" stroke="#fbeebf" stroke-opacity="0.45" stroke-width="3"/>
  </g>
</svg>
